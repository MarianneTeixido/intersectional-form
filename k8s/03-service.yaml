# ClusterIP a secas: la entrada desde fuera la hace el túnel de Cloudflare,
# así que no hace falta Ingress ni LoadBalancer.
apiVersion: v1
kind: Service
metadata:
  name: mapeador
  labels: { app: mapeador }
spec:
  type: ClusterIP
  selector: { app: mapeador }
  ports:
    - name: http
      port: 80
      targetPort: http
