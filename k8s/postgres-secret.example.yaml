# PLANTILLA — copia este archivo a k8s/postgres-secret.yaml, pon la clave real
# y NO lo versiones (k8s/*-secret.yaml está en .gitignore).
#
#   kubectl apply -n mapeador -f k8s/postgres-secret.yaml
#
# Este Secret queda FUERA de lo que sincroniza ArgoCD (vive en k8s/, no en
# k8s/postgres/) justamente para no acabar con una clave de base de datos en
# el repositorio. Aplícalo a mano ANTES de la primera sincronización: sin él,
# el pod de Postgres no arranca.
#
# La misma clave tiene que aparecer en el DATABASE_URL de mapeador-config
# (k8s/01-secret.example.yaml), o la app no se puede conectar.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credenciales
type: Opaque
stringData:
  # Solo se usa cuando initdb crea la base (la primera vez, con el volumen
  # vacío). Cambiarla después aquí no cambia la clave dentro de Postgres:
  # eso se hace con ALTER USER mapeador PASSWORD '...'.
  POSTGRES_PASSWORD: "CAMBIA_ESTO_POR_UNA_CLAVE_LARGA_Y_ALEATORIA"
