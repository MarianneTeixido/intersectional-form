# Service sin IP (headless): es el que gobierna al StatefulSet y, de paso,
# el nombre al que apunta DATABASE_URL.
#
#   postgresql://mapeador:CLAVE@postgres:5432/mapeador
#
# Con clusterIP None el DNS devuelve directo la IP del pod. Si la app vive en
# otro namespace, usa el nombre completo:
#   postgres.mapeador.svc.cluster.local
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: { app: postgres }
spec:
  clusterIP: None
  selector: { app: postgres }
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
