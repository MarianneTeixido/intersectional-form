# PLANTILLA — copia este archivo a 01-secret.yaml, pon los valores reales
# y NO lo versiones (01-secret.yaml está en .gitignore).
#
#   kubectl apply -f k8s/01-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: mapeador-config
type: Opaque
stringData:
  # Base de datos. El esquema se aplica solo al arrancar la app.
  DATABASE_URL: "postgresql://mapeador:CAMBIA_ESTO@postgres:5432/mapeador"

  # ── PENDIENTE: acceso al panel de administración ──
  # Mientras esta clave NO exista, /admin.html y /api/admin/* quedan
  # ABIERTOS a quien tenga la URL. Está bien para pruebas dentro del
  # cluster; NO para el túnel público.
  #
  # Cuando decidas el método, hay dos caminos (ver DESPLIEGUE.md):
  #   a) descomentar esta línea con una clave larga y aleatoria, o
  #   b) poner un proxy de autenticación delante de /admin* y /api/admin/*
  #      (entonces esta línea sobra).
  #
  # ADMIN_TOKEN: "genera-una-cadena-larga-y-aleatoria"
